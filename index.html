<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No title/description here by design — see src/seo/Seo.tsx. -->

    <!--
      Self-hosted fonts. Preload only the two faces used above the fold: the
      display face for the H1 and the body face for the tagline. Preloading all
      eight would compete for bandwidth with the LCP element itself.
    -->
    <link
      rel="preload"
      href="/fonts/clash-display-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <meta name="theme-color" content="#06080F" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Feed autodiscovery: lets readers and some crawlers find the blog feed. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Suraj Tamang — Blog"
      href="/rss.xml"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
